<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贡献者名单 - LrcShare</title>
  <script src="/vendor/tailwind.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@iconify/iconify@3/dist/iconify.min.js"></script>
  <script src="icons.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const DEFAULT_LOGO = 'https://i0.hdslb.com/bfs/article/a2323ad6e33924c39061b35ae29f9fd937977624.png';
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* Tag Chip 颜色 */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.6;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .chip-pink { background-color: #fce7f3; color: #be185d; }
    .chip-purple { background-color: #f3e8ff; color: #7c3aed; }
    .chip-blue { background-color: #dbeafe; color: #1d4ed8; }
    .chip-green { background-color: #dcfce7; color: #15803d; }
    .chip-yellow { background-color: #fef3c7; color: #a16207; }
    .chip-orange { background-color: #ffedd5; color: #c2410c; }
    .chip-cyan { background-color: #cffafe; color: #0e7490; }
    .chip-red { background-color: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body class="bg-gray-50">
  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- 标题区 -->
    <div class="bg-white rounded-2xl shadow-sm p-8 mb-6">
      <div class="text-sm text-pink-500 mb-2">致谢</div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">贡献者名单</h1>
      <p class="text-gray-500">感谢每一位为 LrcShare做出贡献的朋友们 ❤️</p>
    </div>

    <!-- 贡献者列表 -->
    <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">🏆 贡献者名单</h2>
      <div id="contributorsList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
        <div class="col-span-full text-center py-8 text-gray-400">加载中...</div>
      </div>
    </div>

    <!-- 底部说明 -->
    <div class="bg-gradient-to-r from-pink-50 to-purple-50 rounded-2xl shadow-sm p-6 border border-pink-100">
      <p class="text-gray-600 text-center">
        想成为贡献者？<a href="./submit.html" class="text-pink-600 font-medium hover:underline">投稿歌词</a> 或 帮忙设计 LOGO / 文案 / 代码，通过邮件联系站长即可。
      </p>
    </div>
  </main>

  <script>
    const api = window.LRCSHAPE_API;

    function getAvatar(avatar) {
      return avatar && avatar.trim() ? avatar : DEFAULT_LOGO;
    }

    function getChipColor(tag) {
      const t = tag || '';
      if (t.includes('LOGO') || t.includes('设计')) return 'chip-pink';
      if (t.includes('歌词') || t.includes('贡献')) return 'chip-purple';
      if (t.includes('文案')) return 'chip-blue';
      if (t.includes('代码') || t.includes('开发')) return 'chip-green';
      if (t.includes('翻译')) return 'chip-yellow';
      if (t.includes('校对')) return 'chip-orange';
      if (t.includes('美工') || t.includes('美术')) return 'chip-cyan';
      return 'chip-red';
    }

    function renderTags(tags) {
      if (!tags || tags.length === 0) return '';
      const tagArr = Array.isArray(tags) ? tags : String(tags).split(/[,，]/).map(s => s.trim()).filter(Boolean);
      return tagArr.map(t => `<span class="chip ${getChipColor(t)}">${t}</span>`).join('');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try { return new Date(dateStr).toISOString().slice(0, 10); } catch(e) { return ''; }
    }

    function renderFeaturedCard(c) {
      const avatar = getAvatar(c.avatar);
      const tagsHtml = renderTags(c.tags);
      // 社交/联系方式图标行（URL 类型才显示，参考艺术家库样式）
      const contactIcons = renderContactIcons(c);
      const bioHtml = (c.public_bio !== false && c.bio) ? `<p class="text-sm text-gray-600 mt-2">${c.bio}</p>` : '';
      const songCount = typeof c.song_count === 'number' ? c.song_count : 0;

      return `
        <div class="bg-gradient-to-br from-pink-50 to-purple-50 rounded-xl p-5 border border-pink-100 hover:shadow-md transition cursor-pointer relative" onclick="location.href='./contributor.html?id=${c.id}'">
          <div class="flex items-center gap-3">
            <img src="${avatar}" alt="${c.name}" class="w-14 h-14 rounded-full object-cover ring-2 ring-pink-200 flex-shrink-0" onerror="this.src='${DEFAULT_LOGO}'" />
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <h3 class="font-bold text-gray-800 text-base truncate">${c.name}</h3>
                <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-white text-pink-600 text-xs font-semibold rounded-full border border-pink-200 shadow-sm">
                  <span class="iconify w-3.5 h-3.5" data-icon="mdi:music-note"></span>
                  ${songCount} 首
                </span>
              </div>
              <div class="mt-2">${tagsHtml}</div>
            </div>
          </div>
          ${bioHtml}
          ${contactIcons}
        </div>
      `;
    }

    // 渲染联系方式图标行（仅 URL 类型才显示，类似艺术家库页）
    function renderContactIcons(c) {
      if (!c.public_contact || !c.contact_value) return '';
      const cv = typeof c.contact_value === 'string' ? JSON.parse(c.contact_value || '{}') : c.contact_value;
      const entries = Object.entries(cv || {}).filter(([k, v]) => v && /^https?:\/\//i.test(v));
      if (entries.length === 0) return '';
      const icons = entries.map(([k, v]) => {
        const icon = ICON_MAP[k] || 'mdi:link-variant';
        return `<a href="${v}" target="_blank" rel="noopener noreferrer" title="${k}" onclick="event.stopPropagation()" class="inline-flex items-center justify-center w-6 h-6 text-gray-500 hover:text-pink-600 transition"><span class="iconify" style="font-size:20px" data-icon="${icon}"></span></a>`;
      }).join('');
      return `<div class="flex items-center gap-1 mt-3 relative z-10">${icons}</div>`;
    }

    async function initContributors() {
      try {
        const list = await api.getContributors();
        const container = document.getElementById('contributorsList');
        if (!list || list.length === 0) {
          container.innerHTML = '<div class="col-span-full text-center py-8 text-gray-400">暂无贡献者</div>';
        } else {
          container.innerHTML = list.map(renderFeaturedCard).join('');
        }
      } catch (err) {
        console.error('加载贡献者数据失败:', err);
        document.getElementById('contributorsList').innerHTML = '<div class="col-span-full text-center py-8 text-red-400">加载失败，请稍后重试</div>';
      }
    }

    initContributors();
  </script>
  <!-- 共享布局：导航栏 + 页脚 + 搜索弹窗 -->
  <script src="layout.js"></script>
</body>
</html>
