﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章详情 - LrcShare</title>
  <script src="/vendor/tailwind.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="/config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const DEFAULT_LOGO = 'https://i0.hdslb.com/bfs/article/a2323ad6e33924c39061b35ae29f9fd937977624.png';
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .article-content h2 { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-top: 2rem; margin-bottom: 1rem; }
    .article-content h3 { font-size: 1.25rem; font-weight: 700; color: #1f2937; margin-top: 1.5rem; margin-bottom: 0.75rem; }
    .article-content p { line-height: 1.8; color: #374151; margin-bottom: 1rem; }
    .article-content ul { padding-left: 1.5rem; margin-bottom: 1rem; list-style-type: disc; }
    .article-content ol { padding-left: 1.5rem; margin-bottom: 1rem; list-style-type: decimal; }
    .article-content ul li, .article-content ol li { line-height: 1.8; color: #374151; margin-bottom: 0.25rem; }
    .article-content a { color: #ec4899; text-decoration: underline; }
    .article-content a:hover { color: #a855f7; }
    .article-content pre { background-color: #111827; color: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
    .article-content code { background-color: #f3f4f6; color: #ec4899; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; }
    .article-content pre code { background-color: transparent; color: inherit; padding: 0; }
    .article-content img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0; }
    .article-content blockquote { border-left: 4px solid #ec4899; padding-left: 1rem; margin: 1rem 0; color: #6b7280; font-style: italic; }
    .article-content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .article-content th, .article-content td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; }
    .article-content th { background-color: #f9fafb; font-weight: 600; }
  </style>
</head>
<body class="bg-gray-50">
  <main class="max-w-3xl mx-auto px-4 py-8">
    <div id="articleCard" class="bg-white rounded-2xl shadow-sm p-8">
      <div class="w-full text-center py-16 text-gray-400">加载中...</div>
    </div>
  </main>

  <script>
    const api = window.LRCSHAPE_API;
    let ownerName = '';

    const TYPE_LABEL = {
      news: { label: '喜报', class: 'bg-yellow-100 text-yellow-700' },
      tutorial: { label: '教程', class: 'bg-blue-100 text-blue-700' },
      notice: { label: '公告', class: 'bg-red-100 text-red-700' },
      post: { label: '文章', class: 'bg-green-100 text-green-700' }
    };

    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toISOString().slice(0, 10);
    }

    function getSlugFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('slug') || '';
    }

    function renderNotFound() {
      document.getElementById('articleCard').innerHTML = `
        <div class="text-center py-16">
          <div class="text-6xl mb-4">😢</div>
          <h2 class="text-2xl font-bold text-gray-800 mb-2">文章不存在或未发布</h2>
          <p class="text-gray-500 mb-6">这篇文章可能已被删除、草稿中，或者链接有误</p>
          <a href="./posts.html" class="inline-block px-6 py-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition">← 返回文章列表</a>
        </div>
      `;
    }

    function renderArticle(article) {
      const typeInfo = TYPE_LABEL[article.type] || { label: '文章', class: 'bg-gray-100 text-gray-700' };
      document.title = `${article.title} - LrcShare`;
      const isOwner = article.author === '站长';
      const displayName = isOwner ? (ownerName || '站长') : (article.author || '站长');
      const ownerBadge = isOwner ? ' <span class="text-[10px] bg-pink-100 text-pink-600 px-1.5 py-0.5 rounded ml-1">站长</span>' : '';
      // 渲染 Markdown 内容
      let renderedContent = article.content || '';
      if (typeof marked !== 'undefined') {
        // 移除每行4空格缩进，避免被marked解析为代码块
        let content = article.content.replace(/^ {4}/gm, '');
        marked.setOptions({ sanitize: false });
        renderedContent = marked.parse(content);
      }
      document.getElementById('articleCard').innerHTML = `
        <a href="./posts.html" class="inline-flex items-center gap-1 text-sm text-pink-600 hover:text-pink-700 hover:underline mb-6">
          ← 返回文章列表
        </a>
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-4">
            <span class="inline-block px-2.5 py-0.5 text-xs font-medium rounded-full ${typeInfo.class}">${typeInfo.label}</span>
          </div>
          <h1 class="text-3xl font-bold text-gray-800 mb-4">${article.title}</h1>
          <div class="flex items-center gap-4 text-sm text-gray-500 flex-wrap">
            <span>👤 ${displayName}${ownerBadge}</span>
            <span>📅 ${formatDate(article.created_at)}</span>
            <span>📂 ${typeInfo.label}</span>
            <span>👁 ${article.views || 0} 浏览</span>
          </div>
        </div>
        <hr class="border-gray-100 mb-8" />
        <div class="article-content">
          ${renderedContent}
        </div>
      `;
    }

    async function loadArticle() {
      const slug = getSlugFromUrl();
      if (!slug) {
        renderNotFound();
        return;
      }
      try {
        // 并行加载文章和站长信息
        const [article, contributors] = await Promise.all([
          api.getArticleBySlug(slug),
          api.getContributors().catch(() => [])
        ]);
        if (!article || article.status !== 'published') {
          renderNotFound();
          return;
        }
        const owner = contributors.find(c => c.is_owner);
        if (owner) ownerName = owner.name;
        renderArticle(article);
      } catch (err) {
        console.error('加载文章失败:', err);
        renderNotFound();
      }
    }

    loadArticle();
  </script>
  <!-- 共享布局：导航栏 + 页脚 + 搜索弹窗 -->
  <script src="layout.js"></script>
</body>
</html>
