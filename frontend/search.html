﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>搜索 - LrcShare</title>
  <script src="/vendor/tailwind.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const DEFAULT_LOGO = 'https://i0.hdslb.com/bfs/article/a2323ad6e33924c39061b35ae29f9fd937977624.png';
    function generateAvatar(name) {
      return DEFAULT_LOGO;
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body class="bg-gray-50">
  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- Search Box -->
    <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
      <div class="flex gap-3">
        <input
          type="text"
          id="searchInput"
          placeholder="搜索歌曲、歌手或歌词内容..."
          class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500"
        />
        <button id="searchBtn" class="px-6 py-3 bg-pink-500 text-white rounded-xl hover:bg-pink-600">
          🔍 搜索
        </button>
      </div>
    </div>

    <!-- Search Results -->
    <div id="searchResults"></div>
  </main>

  <script>
    const api = window.LRCSHAPE_API;

    function formatDuration(d) {
      if (!d || d === 'NULL' || d === 'null') return '--:--';
      let s = String(d).trim().split('.')[0];
      const parts = s.split(':');
      if (parts.length === 2) {
        return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
      }
      return s;
    }

    async function doSearch() {
      const keyword = document.getElementById('searchInput').value.trim();
      if (!keyword) return;

      const results = document.getElementById('searchResults');
      results.innerHTML = '<div class="text-center py-12 text-gray-400">搜索中...</div>';

      const data = await api.search(keyword);

      let html = '';

      // 歌手结果
      if (data.artists.length > 0) {
        html += `
          <div class="bg-white rounded-2xl shadow-sm p-6 mb-4">
            <h3 class="text-lg font-bold text-gray-800 mb-4">🎤 歌手 (${data.artists.length})</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
              ${data.artists.map(artist => {
                const avatar = artist.avatar || DEFAULT_LOGO;
                return `
                  <a href="./artist.html?id=${artist.id}" class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl">
                    <img src="${avatar}" class="w-10 h-10 rounded-full bg-gray-100 object-contain" />
                    <div>
                      <div class="font-medium text-gray-800">${highlightKeyword(artist.name, keyword)}</div>
                      <div class="text-sm text-gray-500">${artist.aliases && artist.aliases.length ? artist.aliases.join(', ') : ''}</div>
                    </div>
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // 专辑结果
      if (data.albums.length > 0) {
        html += `
          <div class="bg-white rounded-2xl shadow-sm p-6 mb-4">
            <h3 class="text-lg font-bold text-gray-800 mb-4">💿 专辑 (${data.albums.length})</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
              ${data.albums.map(album => `
                <a href="./album.html?id=${album.id}" class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-xl">
                  <div class="w-10 h-10 bg-gradient-to-br from-pink-500 to-purple-600 rounded-lg flex items-center justify-center text-white">💿</div>
                  <div>
                    <div class="font-medium text-gray-800">${highlightKeyword(album.name, keyword)}</div>
                    <div class="text-sm text-gray-500">${album.year || ''}</div>
                  </div>
                </a>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 歌曲结果
      if (data.songs.length > 0) {
        html += `
          <div class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4">🎵 单曲 (${data.songs.length})</h3>
            <div class="divide-y">
              ${data.songs.map(song => {
                // 从LRC中提取匹配的上下文
                const lrcLower = song.lrc_text.toLowerCase();
                const keywordLower = keyword.toLowerCase();
                let snippet = '';
                const idx = lrcLower.indexOf(keywordLower);
                if (idx !== -1) {
                  const start = Math.max(0, idx - 20);
                  const end = Math.min(song.lrc_text.length, idx + keyword.length + 20);
                  snippet = song.lrc_text.substring(start, end).replace(/\[.*?\]/g, '');
                }
                return `
                  <a href="./song.html?id=${song.id}" class="flex items-center gap-4 p-4 hover:bg-gray-50 transition">
                    <div class="w-10 h-10 bg-pink-100 rounded-full flex items-center justify-center text-pink-600">🎵</div>
                    <div class="flex-1">
                      <div class="font-medium text-gray-800">${highlightKeyword(song.title, keyword)}</div>
                      <div class="text-sm text-gray-500">
                        ${highlightKeyword(song.artist_name, keyword)} · ${highlightKeyword(song.album_name, keyword)}
                        ${snippet ? `<div class="text-xs text-gray-400 mt-1 truncate">...${highlightKeyword(snippet, keyword)}...</div>` : ''}
                      </div>
                    </div>
                    <span class="text-gray-400 text-sm tabular-nums">${formatDuration(song.duration)}</span>
                  </a>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      if (!html) {
        html = `
          <div class="bg-white rounded-2xl shadow-sm p-12 text-center">
            <div class="text-6xl mb-4">😔</div>
            <div class="text-gray-500">没有找到与 "${keyword}" 相关的结果</div>
          </div>
        `;
      }

      results.innerHTML = html;
    }

    function highlightKeyword(text, keyword) {
      if (!keyword) return text;
      const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<span class="text-pink-500 font-bold">$1</span>');
    }

    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('searchInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') doSearch();
    });

    // 从URL参数获取搜索词
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) {
      document.getElementById('searchInput').value = q;
      doSearch();
    }
  </script>
  <script src="layout.js"></script>
</body>
</html>
